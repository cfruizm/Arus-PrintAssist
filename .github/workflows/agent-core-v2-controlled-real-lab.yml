name: Agent Core v2 controlled real lab
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Escenario existente que se ejecutara"
        required: true
        default: "monitoring"
        type: choice
        options: [monitoring, console_access, missing_jobs, hive_pin_question, hive_pin_statement, requirements, out_of_scope]
permissions:
  contents: read
env:
  PYTHONPATH: ${{ github.workspace }}
  LLM_PROVIDER: groq
  LLM_FALLBACK_ENABLED: "false"
  GROQ_ORCHESTRATOR_MODEL: "qwen/qwen3.8-27b"
  GROQ_ANSWER_MODEL: "qwen/qwen3.8-27b"
  GROQ_STRUCTURED_OUTPUT_MODE: "best_effort"
  LLM_MAX_CALLS_PER_SESSION: "6"
  LLM_MAX_TOTAL_TOKENS_PER_SESSION: "4000"
  LLM_ORCHESTRATOR_MAX_TOKENS: "300"
  LLM_EVIDENCE_JUDGE_MAX_TOKENS: "300"
  LLM_ANSWER_MAX_TOKENS: "400"
  AGENT_CORE_V2_INITIAL_CANDIDATES: "3"
  AGENT_CORE_V2_MAX_CANDIDATES: "5"
jobs:
  controlled-real-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tools/agent_core_v2/checkpoint_gate.py
      - name: Validate normalized semantic contract
        run: python tools/agent_core_v2/test_contract_normalization.py
      - name: Verify imports and models
        run: python -c "import os,app; from app.agent_core_v2.real_lab import run_real_scenario; assert os.environ['GROQ_ORCHESTRATOR_MODEL']=='qwen/qwen3.8-27b'; assert os.environ['GROQ_ANSWER_MODEL']=='qwen/qwen3.8-27b'; print('Imports and Qwen models OK')"
      - name: Execute one controlled real scenario
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python tools/agent_core_v2/run_controlled_real_lab.py --scenario "${{ inputs.scenario }}"
      - name: Upload laboratory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-core-v2-real-lab-${{ inputs.scenario }}
          path: |
            artifacts/agent_core_v2_checkpoint.json
            artifacts/agent_core_v2_real_lab.json
          if-no-files-found: warn
